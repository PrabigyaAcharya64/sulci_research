<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positron Emission Tomography</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:    #FFFFFF;
      --ink:   #1A1A1A;
      --muted: #6B7280;
      --new:   #C2410C;
      --old:   #1D4ED8;
      --rule:  #E5E7EB;
    }
    html, body { background: var(--bg); }
    .reveal-viewport { background: var(--bg); }
    .reveal { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); font-size: 24px; }
    .reveal .slides { text-align: left; }
    /* Heading pinned top, takeaway pinned bottom, body centred between them.
       The two flex spacers are ordered around the body so every slide shares
       the same anchors however much content it carries. */
    /* reveal.js writes `display` inline on the visible slide, so the flex layout
       comes from its `display: 'flex'` config option rather than from here */
    .reveal .slides section {
      height: 720px; padding: 48px 60px 56px; box-sizing: border-box;
      flex-direction: column;
    }
    .reveal .slides section > aside.notes { display: none; }
    .reveal .slides section > h2 { order: 0; }
    .reveal .slides section::before { content: ''; order: 1; flex: 1 1 0; }
    .reveal .slides section > :not(h2):not(.takeaway) { order: 2; }
    .reveal .slides section::after { content: ''; order: 3; flex: 1 1 0; }
    .reveal .slides section > .takeaway { order: 4; }

    .reveal h1, .reveal h2 {
      font-family: 'Newsreader', Georgia, serif;
      font-weight: 500; color: var(--ink);
      text-transform: none; letter-spacing: normal; line-height: 1.1;
    }
    .reveal h2 { font-size: 42px; margin: 0 0 10px; }

    /* equations — the spine of this deck */
    .reveal .eq { margin: 38px 0 0; text-align: center; }
    .reveal .eq .katex-display { margin: 0; }
    .reveal .eq .katex { font-size: 1.38em; }
    .reveal .eq.sm .katex { font-size: 1.08em; }
    .reveal .eq.lead { margin-top: 70px; }

    /* paper cross-reference, so every formula is traceable */
    .reveal .ref {
      font-family: 'IBM Plex Mono', monospace; font-size: 14px;
      color: var(--muted); text-align: center; margin: 12px 0 0;
    }
    .reveal .takeaway {
      font-family: 'Newsreader', Georgia, serif; font-size: 28px;
      color: var(--ink); text-align: center; margin: 48px 0 0;
    }
    .reveal .sub { font-size: 18px; color: var(--muted); text-align: center; margin: 16px 0 0; }
    .reveal figure { margin: 32px 0 0; text-align: center; }
    .reveal figure svg { display: block; margin: 0 auto; }

    /* compact symbol legend / two-column comparison (optimization slides) */
    .reveal .legend {
      display: grid; grid-template-columns: max-content max-content max-content max-content;
      column-gap: 18px; row-gap: 12px; align-items: baseline;
      width: fit-content; margin: 34px auto 0; font-size: 18px; color: var(--muted);
    }
    .reveal .legend .k { color: var(--ink); text-align: right; }
    .reveal .legend .v { padding-right: 34px; }
    .reveal .legend .katex { font-size: 1.12em; }
    .reveal .compare {
      display: grid; grid-template-columns: 1fr 1fr; column-gap: 56px;
      width: 900px; margin: 34px auto 0; font-size: 19px; line-height: 1.5; color: var(--muted); text-align: center;
    }
    .reveal .compare b { display: block; font-weight: 500; color: var(--ink); margin-bottom: 6px; }
    .reveal .compare .katex { font-size: 1.1em; color: var(--ink); }
    .reveal .compare + .sub { margin-top: 30px; }

    /* title slide */
    .reveal .title-slide h1 { font-size: 58px; text-align: center; margin: 180px 0 0; }
    .reveal .title-slide .sub { font-size: 20px; margin-top: 26px; }


    /* PET deck additions */
    .reveal .title-slide .name { font-family: 'Inter', system-ui, sans-serif; font-size: 22px; color: var(--ink); text-align: center; margin-top: 64px; }
    .reveal .lead-text { font-size: 26px; line-height: 1.5; text-align: center; max-width: 980px; margin: 0 auto; }
    .reveal .lead-text b { font-weight: 500; }
    .reveal .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; width: 1040px; margin: 0 auto; }
    .reveal .cols h3 { font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 30px; margin: 0 0 14px; text-transform: none; }
    .reveal .cols ul { margin: 0; padding-left: 22px; font-size: 21px; line-height: 1.55; color: var(--ink); }
    .reveal .cols ul li::marker { color: var(--muted); }
    .reveal .cols .tag { font-size: 15px; color: var(--muted); margin: 0 0 14px; }
    .reveal .card { border-top: 2px solid var(--ink); padding-top: 18px; }
    .reveal .card.blue { border-color: var(--old); }
    .reveal .card.orange { border-color: var(--new); }
    .reveal table.iso { margin: 34px auto 0; border-collapse: collapse; font-size: 21px; }
    .reveal table.iso th { font-weight: 500; font-size: 15px; color: var(--muted); text-align: left; padding: 0 28px 10px 0; border-bottom: 1px solid var(--rule); }
    .reveal table.iso td { padding: 12px 28px 12px 0; border-bottom: 1px solid var(--rule); }
    .reveal table.iso td.num { font-family: 'IBM Plex Mono', monospace; font-size: 19px; }
    .reveal .mols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 40px; width: 1100px; margin: 0 auto; text-align: center; }
    .reveal .mols .wide { grid-column: 1 / -1; }
    .reveal .mols svg { display: block; margin: 0 auto; }
    .reveal .mols .mname { font-family: 'Newsreader', Georgia, serif; font-size: 24px; margin-top: 4px; }
    .reveal .mols .mrole { font-size: 16px; color: var(--muted); margin-top: 4px; }
    .reveal .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 10px; vertical-align: -1px; border: 1px solid #E5E7EB; }
    .reveal .divider h2 { font-size: 56px; text-align: center; margin: 0; }
    .reveal .divider .sub { font-size: 22px; margin-top: 22px; }

    /* no decorative motion anywhere in this deck */
    @media (prefers-reduced-motion: reduce) { .reveal .slides section { transition: none; } }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown="slides/01-title.md" data-separator-notes="^Note:"></section>
      <section data-markdown="slides/02-what-is-pet.md" data-separator-notes="^Note:"></section>
      <section data-markdown="slides/03-types.md" data-separator-notes="^Note:"></section>

      <section data-markdown="slides/08-injection.md" data-separator-notes="^Note:"></section>

      <section data-markdown="slides/16-quantification.md" data-separator-notes="^Note:"></section>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/smiles-drawer@2.1.7/dist/smiles-drawer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/plugin/notes/notes.js"></script>
  <script src="../overview-carousel.js"></script>
  <script src="../annotations.js"></script>
  <script>
    Reveal.initialize({
      plugins: [ RevealMarkdown, RevealNotes ],
      width: 1280, height: 720,
      display: 'flex',
      navigationMode: 'linear',
      transition: 'fade', transitionSpeed: 'fast',
      controls: false, progress: false, slideNumber: false,
      hash: true, fragments: false, loop: false
    });
    installOverviewCarousel(Reveal);
    installAnnotations(Reveal);

    Reveal.addKeyBinding({ keyCode: 40, key: '↓', description: 'Next slide' },
      () => Reveal.slide(Reveal.getIndices().h + 1, 0));
    Reveal.addKeyBinding({ keyCode: 38, key: '↑', description: 'Prev slide' },
      () => Reveal.slide(Math.max(0, Reveal.getIndices().h - 1), 0));

    // TeX lives in data-tex attributes so markdown never touches the backslashes.
    function renderMath(root) {
      (root || document).querySelectorAll('[data-tex]').forEach(el => {
        if (el.dataset.rendered) return;
        katex.render(el.getAttribute('data-tex'), el, {
          throwOnError: false,
          displayMode: !el.classList.contains('inline')
        });
        el.dataset.rendered = '1';
      });
    }

    // Chemical structures are drawn from SMILES so the geometry is computed, not hand-drawn.
    // Element colours follow the deck palette; fluorine (the 18F label) is orange.
    const MOL_THEME = {
      C: '#1A1A1A', O: '#1A1A1A', N: '#1D4ED8', F: '#C2410C', S: '#1A1A1A', H: '#1A1A1A',
      CL: '#1A1A1A', BR: '#1A1A1A', I: '#1A1A1A', P: '#1A1A1A', B: '#1A1A1A', SI: '#1A1A1A',
      BACKGROUND: '#FFFFFF'
    };
    // All structures on a slide share one scale (px per bond length), so their sizes compare.
    function renderMolecules(root) {
      if (!window.SmilesDrawer) return;
      const svgs = Array.from((root || document).querySelectorAll('svg[data-smiles]')).filter(s => !s.dataset.rendered);
      svgs.forEach(svg => {
        const drawer = new SmilesDrawer.SvgDrawer({
          bondThickness: 1.3, bondLength: 30, fontSizeLarge: 11, fontSizeSmall: 7.5, padding: 6,
          compactDrawing: false, terminalCarbons: svg.dataset.terminal === '1',
          themes: { deck: MOL_THEME }
        });
        SmilesDrawer.parse(svg.getAttribute('data-smiles'), tree => {
          drawer.draw(tree, svg, 'deck');
          svg.dataset.rendered = '1';
          // isotope-labelled carbon: colour the 11C label blue to match the table
          svg.querySelectorAll('text').forEach(t => { if (/¹¹|11/.test(t.textContent)) t.setAttribute('fill', '#1D4ED8'); });
        }, err => console.error('SMILES', err));
      });
    }
    // One common scale (px per bond length) for every molecule on a slide. SmilesDrawer pads
    // its viewBox to a square, so measure the real drawing with getBBox — which needs the
    // slide to be visible, hence this runs for the current slide.
    function layoutMolecules(slide) {
      if (!slide) return;
      const list = Array.from(slide.querySelectorAll('svg[data-smiles][data-rendered]')).filter(s => !s.dataset.laid);
      if (!list.length) return;
      let k = Infinity;
      const boxes = list.map(svg => {
        svg.removeAttribute('width'); svg.removeAttribute('height');
        const b = svg.getBBox(), pad = 4;
        const box = { x: b.x - pad, y: b.y - pad, w: b.width + 2 * pad, h: b.height + 2 * pad };
        const [bw, bh] = svg.dataset.box.split('x').map(Number);
        k = Math.min(k, bw / box.w, bh / box.h);
        return [svg, box];
      });
      if (!isFinite(k) || k <= 0) return;
      boxes.forEach(([svg, b]) => {
        svg.setAttribute('viewBox', `${b.x} ${b.y} ${b.w} ${b.h}`);
        svg.setAttribute('width', (b.w * k).toFixed(1));
        svg.setAttribute('height', (b.h * k).toFixed(1));
        svg.dataset.laid = '1';
      });
    }
    Reveal.on('ready', e => { renderMath(); renderMolecules(); layoutMolecules(e.currentSlide); });
    Reveal.on('slidechanged', e => { renderMath(e.currentSlide); renderMolecules(e.currentSlide); layoutMolecules(e.currentSlide); });
    Reveal.on('overviewhidden', () => layoutMolecules(Reveal.getCurrentSlide()));
  </script>
</body>
</html>
